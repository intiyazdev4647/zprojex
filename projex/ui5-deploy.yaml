# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.ennovi.projex
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://fioridev.ennovi.com:44310
          client: '800'
        app:
          name: ZPROJEX
          package: ZFIORI
          transport: FGDK900616
        exclude:
          - /test/
